[package]
name = "tenet-cli"
version = "0.1.0"
edition = "2021"
description = "Agent-neutral evidence-backed completion authority"
license = "MIT"

[lib]
name = "tenet_domain"
path = "src/lib.rs"

[[bin]]
name = "tenet"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rmcp = { version = "3.1.4", default-features = false, features = ["macros", "schemars", "server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "1.1.4"
tokio = { version = "1", features = ["io-std", "rt", "sync"] }

[dev-dependencies]
proptest = "1"
