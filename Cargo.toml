[workspace]
resolver = "2"
members = [
  "loops-domain",
  "loops-runtime",
  "loops-acp",
  "loops-projection",
  "loops-tui",
  "loops-cli",
]
default-members = ["loops-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
description = "Autonomous spec-driven development loops powered by headless coding agents"
license = "MIT"
[workspace.dependencies]
agent-client-protocol = "2"
anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
include_dir = "0.7"
ratatui = "0.30"
rusqlite = { version = "0.38", features = ["backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1.1.4"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
strip = true
