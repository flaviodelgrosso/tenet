[workspace]
resolver = "2"
members = [
  "tenet-acp",
  "tenet-cli",
  "tenet-controller",
  "tenet-domain",
  "tenet-runtime",
  "tenet-storage",
]
default-members = ["tenet-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
description = "Deterministic orchestration for autonomous coding agents"
license = "MIT"

[workspace.dependencies]
agent-client-protocol = "2"
anyhow = "1"
bollard = { version = "0.21.1", default-features = false, features = ["http"] }
futures-util = "0.3"
hyper = { version = "1", features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
colored = "3"
globset = "0.4"
hmac = "0.13"
jsonschema = "0.49"
libc = "0.2"
petgraph = "0.8"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "uuid", "json"] }
proptest = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
schemars = { version = "1", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio-util = { version = "0.7", features = ["io", "rt"] }
tokio = { version = "1", features = ["full"] }
toml = "1.1.4"
uuid = { version = "1", features = ["v4", "serde"] }
