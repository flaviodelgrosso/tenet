[workspace]
resolver = "2"
members = [
  "tenet-acp",
  "tenet-cli",
  "tenet-controller",
  "tenet-domain",
  "tenet-runtime",
  "tenet-storage",
]
default-members = ["tenet-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
description = "Deterministic orchestration for autonomous coding agents"
license = "MIT"

[workspace.dependencies]
agent-client-protocol = "2"
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
colored = "3"
globset = "0.4"
hmac = "0.13"
jsonschema = "0.49"
libc = "0.2"
microsandbox = { version = "=0.6.15", default-features = false, features = ["net", "prebuilt"] }
petgraph = "0.8"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "uuid", "json"] }
proptest = "1"
schemars = { version = "1", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tar = "0.4"
tokio-util = { version = "0.7", features = ["io", "rt"] }
tokio = { version = "1", features = ["full"] }
toml = "1.1.4"
uuid = { version = "1", features = ["v4", "serde"] }
