[package]
name = "tenet-cli"
version = "0.1.0"
edition = "2021"
description = "Agent-neutral evidence-backed completion authority"
license = "MIT"

[lib]
name = "tenet_domain"
path = "src/lib.rs"

[[bin]]
name = "tenet"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "1.1.4"

[dev-dependencies]
proptest = "1"
