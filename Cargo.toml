[workspace]
members = ["tenet-domain", "tenet-application", "tenet-mcp", "tenet-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
description = "Agent-neutral evidence-backed completion authority"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
proptest = "1"
rmcp = { version = "3.1.4", default-features = false, features = ["macros", "schemars", "server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "rt", "sync"] }
toml = "1.1.4"
tenet-application = { path = "tenet-application" }
tenet-domain = { path = "tenet-domain" }
tenet-mcp = { path = "tenet-mcp" }
