[workspace]
resolver = "2"
members = ["tenet-cli", "tenet-domain"]
default-members = ["tenet-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
description = "Agent-neutral evidence-backed completion authority"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
proptest = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "1.1.4"
