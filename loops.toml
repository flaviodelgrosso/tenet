#:schema ./schemas/config.schema.json

version = 1
spec_file = ".loops/spec.md"
max_cycles = 25
max_repair_attempts = 3
stagnation_limit = 3
protected_paths = [
  ".loops/spec.md",
  "AGENTS.md",
  "loops.toml",
  ".loops/state.json",
  ".loops/requirements.json",
  ".loops/roadmap.json",
  ".loops/STOP",
  ".loops/run.lock",
]

[agent]
completion_retries = 2
turn_timeout_secs = 900

[agent.custom]
command = "omp"
args = ["acp"]

[agent.preferences.default]
thought_level = "high"
model = "openai-codex/gpt-5.6-sol"

[agent.preferences.roles]
architect = { thought_level = "xhigh" }
reconcile = { model = "openai-codex/gpt-5.6-terra" }
implement = { thought_level = "medium", model = "openai-codex/gpt-5.6-luna" }
repair = { model = "openai-codex/gpt-5.6-luna" }
assess = { thought_level = "medium", model = "openai-codex/gpt-5.6-terra" }

[verification]
require_project_gate = false
commands = []
timeout_secs = 120
max_output_bytes = 65536

[git]
init = true
auto_commit = false
require_clean_tree = false

[execution]
max_parallel_workers = 1
workspace = "worktree"
require_clean_base = true

[integration]
strategy = "cherry_pick"
verify_each_candidate = true
