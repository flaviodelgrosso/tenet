#:schema ./.tenet/config.schema.json

version = 1
spec_file = "spec.md"
max_cycles = 25
max_repair_attempts = 3

[agent.custom]
command = "omp"
args = ["acp"]

[agent.preferences.default]
thought_level = "xhigh"
model = "github-copilot/gpt-5.6-luna"

[agent.preferences.roles]
architect = { model = "github-copilot/gpt-5.6-sol" }
reconcile = { thought_level = "medium", model = "github-copilot/gpt-5.6-terra" }
implement = { thought_level = "medium", model = "github-copilot/gpt-5.6-terra" }
repair = { thought_level = "high" }
assess = { thought_level = "high" }

[verification]
timeout_secs = 300
max_output_bytes = 65536

[[verification.checks]]
name = "quality"
command = ["make", "ci"]

[execution]
max_parallel_workers = 3
